        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'ar' : 'en';
            const htmlRoot = document.getElementById('htmlRoot');
            htmlRoot.setAttribute('lang', currentLang);
            htmlRoot.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
            document.getElementById('langText').innerText = currentLang === 'en' ? 'AR' : 'EN';

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[currentLang][key]) {
                    el.innerText = translations[currentLang][key];
                }
            });
        }

        function toggleTheme() {
            const htmlRoot = document.getElementById('htmlRoot');
            const themeIcon = document.getElementById('themeIcon');
            if (htmlRoot.classList.contains('dark')) {
                htmlRoot.classList.remove('dark');
                htmlRoot.classList.add('light');
                localStorage.setItem('siteTheme', 'light');
                themeIcon.classList.remove('fa-sun');
                themeIcon.classList.add('fa-moon');
            } else {
                htmlRoot.classList.remove('light');
                htmlRoot.classList.add('dark');
                localStorage.setItem('siteTheme', 'dark');
                themeIcon.classList.remove('fa-moon');
                themeIcon.classList.add('fa-sun');
            }
        }

        function switchDepartment(deptKey) {
            currentDept = deptKey;
            const tabSt = document.getElementById('tab-st');
            const tabArch = document.getElementById('tab-arch');
            const bgPattern = document.getElementById('bgPattern');
            const glowEffect = document.getElementById('glowEffect');
            const headerBadge = document.getElementById('headerBadge');
            const mainTitleGradient = document.getElementById('mainTitleGradient');
            const langBtn = document.getElementById('langBtn');
            const modalBox = document.getElementById('galleryModalBox');

                tabSt.className = "px-8 py-3 rounded-xl font-black text-base bg-yellow-500 text-zinc-950 shadow-lg shadow-yellow-500/20 transition-all flex items-center gap-2";

        function renderStudentFilters() {
            const container = document.getElementById('studentFilters');
            container.innerHTML = '';
            const dept = departmentsData[currentDept];

            dept.students.forEach(student => {
                const btn = document.createElement('button');
                const isActive = student.key === currentStudent;
                const activeClass = currentDept === 'st' ? 'bg-yellow-500 text-zinc-950 shadow-md' : 'bg-arch-500 text-zinc-950 shadow-md';
                const inactiveClass = 'bg-zinc-800/80 text-gray-300 border border-zinc-700 hover:opacity-80';
                
                btn.className = `px-5 py-2.5 rounded-xl font-bold text-sm transition-all ${isActive ? activeClass : inactiveClass}`;
                btn.innerText = student.name;
                btn.onclick = () => {
                    currentStudent = student.key;
                    renderStudentFilters();
                    renderTasks();
                };
                container.appendChild(btn);
            });
        }

            const tasks = dept.tasks[currentStudent] || [];
            const cardClass = currentDept === 'st' ? 'glass-card-st' : 'glass-card-arch';
            const badgeColor = currentDept === 'st' ? 'text-yellow-500 bg-yellow-500/10 border-yellow-500/30' : 'text-arch-500 bg-arch-500/10 border-arch-500/30';
            const btnColor = currentDept === 'st' ? 'bg-yellow-500/10 hover:bg-yellow-500 text-yellow-500 border-yellow-500/30 hover:text-zinc-950' : 'bg-arch-500/10 hover:bg-arch-500 text-arch-500 border-arch-500/30 hover:text-zinc-950';
            const engFolder = currentDept === 'st' ? (currentStudent === 'abdallah' ? 'Abdallah Nagy - R25' : (currentStudent === 'saman' ? 'عبدالله السمان - R25' : 'يوسف عادل - R25')) : 'Architectural Folder';

            tasks.forEach(task => {
                const card = document.createElement('div');
                card.className = `${cardClass} p-6 flex flex-col justify-between`;
                
                const firstImg = task.files.find(f => f.toLowerCase().endsWith('.png') || f.toLowerCase().endsWith('.jpg'));
                const rawPath = firstImg ? `best_of_work/${engFolder}/${task.folderName}/${firstImg}` : '';
                const previewPath = firstImg ? encodeURI(rawPath) : '';
                
                card.innerHTML = `
                    <div>
                        <div class="task-container mb-4 h-52 cursor-pointer bg-zinc-900 border border-zinc-800 flex items-center justify-center overflow-hidden rounded-xl group relative" onclick='openTaskGallery("${engFolder}", ${JSON.stringify(task)})'>
                            ${firstImg ? 
                                `<img src="${previewPath}" alt="${task.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" onerror="this.parentElement.innerHTML='<div class=\\'flex flex-col items-center justify-center text-yellow-500\\'><i class=\\'fas fa-file-pdf text-6xl mb-2 text-red-500\\'></i><span class=\\'text-xs text-gray-300\\'>View Task Files & PDFs</span></div>'">` :
                                `<div class="flex flex-col items-center justify-center">
                                    <i class="fas fa-file-pdf text-red-500 text-6xl mb-2"></i>
                                    <span class="text-xs text-gray-300">View Task PDFs</span>
                                </div>`
                            }
                            <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity flex flex-col items-center justify-center text-yellow-400 font-bold gap-1">
                                <i class="fas fa-folder-open text-2xl"></i> <span class="text-xs">Browse Task Folder</span>
                            </div>
                        </div>
                        <div class="flex justify-between items-start mb-2">
                            <span class="px-3 py-1 border text-xs font-bold rounded-lg ${badgeColor}">Task 0${task.id}</span>
                            <span class="text-xs font-bold px-2.5 py-1 rounded-md bg-zinc-800 text-gray-300">${dept.name}</span>
                        </div>
                        <h3 class="text-lg font-bold mb-2">${task.title}</h3>
                        <p class="text-sm text-gray-500 dark:text-gray-400 mb-6">Contains professional deliverables, layouts, and reports.</p>
                    </div>
                    <button onclick='openTaskGallery("${engFolder}", ${JSON.stringify(task)})' class="w-full border font-bold py-2.5 px-4 rounded-xl transition-all duration-300 flex items-center justify-center gap-2 text-sm ${btnColor}">
                        <i class="fas fa-folder-open"></i> <span>Browse Task Folder</span>
                    </button>
                `;
                container.appendChild(card);
            });
        }

        function openTaskGallery(engFolder, task) {
            const modal = document.getElementById('taskGalleryModal');
            const titleEl = document.getElementById('galleryTitle');
            const gridEl = document.getElementById('galleryGrid');

            modal.classList.remove('hidden');
            titleEl.innerText = `${task.title}`;
            gridEl.innerHTML = '';

            task.files.forEach(file => {
                const rawFilePath = `best_of_work/${engFolder}/${task.folderName}/${file}`;
                const filePath = encodeURI(rawFilePath);
                const itemDiv = document.createElement('div');
                itemDiv.className = "bg-zinc-800/60 border border-zinc-700 rounded-xl p-3 flex flex-col items-center justify-center gap-2 h-48 overflow-hidden relative group";
                
                if(file.toLowerCase().endsWith('.pdf')) {
                    itemDiv.innerHTML = `
                        <i class="fas fa-file-pdf text-red-500 text-4xl mb-2"></i>
                        <span class="text-xs text-gray-300 truncate max-w-full" title="${file}">${file}</span>
                        <a href="${filePath}" target="_blank" class="mt-2 bg-yellow-500/20 text-yellow-400 hover:bg-yellow-500 hover:text-zinc-950 font-bold px-3 py-1.5 rounded-lg text-xs transition flex items-center gap-1.5">
                            <i class="fas fa-external-link-alt"></i> Open PDF
                        </a>
                    `;
                } else {
                    itemDiv.innerHTML = `
                        <img src="${filePath}" alt="Task File" class="w-full h-32 object-cover rounded-lg group-hover:scale-105 transition duration-300" onerror="this.parentElement.innerHTML='<i class=\\'fas fa-image text-yellow-500 text-4xl mb-2\\'></i><span class=\\'text-xs text-gray-300\\'>${file}</span>'">
                        <span class="text-xs text-gray-300 truncate max-w-full" title="${file}">${file}</span>
                    `;
                }
                gridEl.appendChild(itemDiv);
            });
        }

        function closeTaskGallery() {
            document.getElementById('taskGalleryModal').classList.add('hidden');
        }

        window.addEventListener('DOMContentLoaded', () => {
            const currentTheme = localStorage.getItem('siteTheme') || 'dark';
            const themeIcon = document.getElementById('themeIcon');
            if (currentTheme === 'light') {
                themeIcon.classList.remove('fa-sun');
                themeIcon.classList.add('fa-moon');
            }
            switchDepartment('st');
        });
    </script>
</body>
</html>
