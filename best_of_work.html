<!DOCTYPE html>
<html lang="en" dir="ltr" id="htmlRoot" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page_title">Best Of Work - Structural Diploma | 3 Engineers</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="New Lgogo_Gray Logo.png">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { 
                extend: { 
                    colors: { 
                        brand: { 
                            500: '#eab308', 
                            600: '#ca8a04' 
                        } 
                    } 
                } 
            }
        }
    </script>
    <!-- Cairo Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { 
            font-family: 'Cairo', sans-serif; 
            transition: background-color 0.4s ease, color 0.4s ease;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }
        .dark body { background-color: #09090b; color: #f4f4f5; }
        .light body { background-color: #fafafa; color: #18181b; }

        .yellow-blueprint-bg {
            background-image: 
                linear-gradient(rgba(234, 179, 8, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(234, 179, 8, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -2;
        }

        .glass-nav { 
            backdrop-filter: blur(16px); 
            transition: all 0.3s ease;
        }
        .dark .glass-nav { background: rgba(9, 9, 11, 0.85); border-bottom: 1px solid rgba(234, 179, 8, 0.15); }
        .light .glass-nav { background: rgba(255, 255, 255, 0.85); border-bottom: 1px solid rgba(228, 228, 231, 0.9); }

        .glass-card { 
            backdrop-filter: blur(12px); 
            border-radius: 20px; 
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
            position: relative;
            overflow: hidden;
        }
        .dark .glass-card { background: linear-gradient(145deg, rgba(24, 24, 27, 0.8), rgba(9, 9, 11, 0.9)); border: 1px solid rgba(234, 179, 8, 0.15); }
        .light .glass-card { background: linear-gradient(145deg, rgba(255, 255, 255, 0.95), rgba(244, 244, 5, 0.02)); border: 1px solid rgba(228, 228, 231, 1); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.03); }

        .glass-card::before {
            content: '';
            position: absolute;
            right: 0; top: 0; bottom: 0;
            width: 4px;
            background: linear-gradient(to bottom, #eab308, #facc15);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .dark [dir="rtl"] .glass-card::before, [dir="rtl"] .glass-card::before { left: 0; right: auto; }
        .glass-card:hover { 
            transform: translateY(-8px) scale(1.01); 
            border-color: rgba(234, 179, 8, 0.5); 
            box-shadow: 0 25px 50px -12px rgba(234, 179, 8, 0.25);
        }
        .glass-card:hover::before { opacity: 1; }

        .text-gradient { 
            background: linear-gradient(135deg, #facc15, #eab308, #ca8a04); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }

        .task-img-container {
            overflow: hidden;
            border-radius: 12px;
            position: relative;
            background-color: #18181b;
        }
    </style>
    
    <script>
        const savedTheme = localStorage.getItem('siteTheme') || 'dark';
        document.documentElement.className = savedTheme;
    </script>
</head>
<body class="antialiased relative">

    <div class="yellow-blueprint-bg"></div>
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[900px] h-[650px] bg-yellow-500/10 rounded-full blur-[140px] -z-10 pointer-events-none"></div>

    <!-- Navbar -->
    <nav class="glass-nav fixed w-full z-50 top-0 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <div class="flex-shrink-0">
                    <a href="index.html" class="flex items-center gap-2">
                        <img src="New Lgogo_Gray Logo.png" alt="3 Engineers" class="h-10 hover:opacity-90 transition">
                    </a>
                </div>
                
                <div class="hidden md:flex items-center space-x-8 rtl:space-x-reverse">
                    <a href="index.html" class="font-semibold transition text-gray-400 hover:text-yellow-400" data-i18n="nav_home">Home</a>
                    <a href="index.html#courses" class="font-semibold transition text-gray-400 hover:text-yellow-400" data-i18n="nav_courses">Training Programs</a>
                    <a href="best_of_work.html" class="font-semibold transition text-yellow-400 border-b-2 border-yellow-500 pb-1" data-i18n="nav_best_work">Best Of Work</a>
                </div>
                
                <div class="flex items-center gap-3">
                    <button onclick="toggleLanguage()" class="px-3.5 py-2 rounded-xl text-xs font-bold bg-yellow-500/10 text-yellow-500 border border-yellow-500/20 hover:bg-yellow-500/20 transition flex items-center gap-1.5">
                        <i class="fas fa-globe"></i> <span id="langText">AR</span>
                    </button>

                    <button onclick="toggleTheme()" class="w-10 h-10 rounded-xl bg-zinc-800/50 dark:bg-zinc-800/80 text-gray-300 dark:text-yellow-400 border border-zinc-700 flex items-center justify-center transition hover:scale-105">
                        <i id="themeIcon" class="fas fa-sun text-sm"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Header Section -->
    <section class="relative pt-36 pb-16 lg:pt-48 lg:pb-20 text-center">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-yellow-500/10 border border-yellow-500/20 text-yellow-500 text-sm font-bold mb-6 backdrop-blur-md shadow-sm animate-pulse">
                <i class="fas fa-award"></i> <span data-i18n="badge_title">Structural Engineering Diploma Showcase</span>
            </div>
            <h1 class="text-4xl sm:text-5xl lg:text-6xl font-extrabold tracking-tight mb-6 leading-tight">
                <span data-i18n="main_title1">Student Best Works &</span> <br>
                <span class="text-gradient" data-i18n="main_title2">R25 Tasks Exhibition</span>
            </h1>
            <p class="text-base sm:text-lg text-gray-500 dark:text-gray-400 mb-8 leading-relaxed max-w-2xl mx-auto" data-i18n="main_desc">
                Browse student tasks from Task 0 to Task 7 pulled directly from GitHub repository folders.
            </p>

            <!-- Engineer Filter Tabs -->
            <div class="flex flex-wrap justify-center gap-3 mt-8">
                <button onclick="filterEngineer('abdallah')" id="btn-abdallah" class="px-5 py-2.5 rounded-xl font-bold text-sm bg-yellow-500 text-zinc-950 shadow-md transition-all">Abdallah Nagy - R25</button>
                <button onclick="filterEngineer('saman')" id="btn-saman" class="px-5 py-2.5 rounded-xl font-bold text-sm bg-zinc-800/80 text-gray-300 border border-zinc-700 hover:bg-yellow-500/20 hover:text-yellow-400 transition-all">عبدالله السمان - R25</button>
                <button onclick="filterEngineer('youssef')" id="btn-youssef" class="px-5 py-2.5 rounded-xl font-bold text-sm bg-zinc-800/80 text-gray-300 border border-zinc-700 hover:bg-yellow-500/20 hover:text-yellow-400 transition-all">يوسف عادل - R25</button>
            </div>
        </div>
    </section>

    <!-- Tasks Grid Section -->
    <section class="pb-28 relative">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8" id="tasksContainer">
                <!-- Dynamic Content -->
            </div>
        </div>
    </section>

    <!-- Task Files Modal Viewer -->
    <div id="taskGalleryModal" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-xl hidden flex flex-col items-center justify-center p-4 sm:p-6">
        <div class="w-full max-w-5xl flex justify-between items-center mb-4">
            <h3 id="galleryTitle" class="text-xl font-bold text-yellow-400"></h3>
            <button onclick="closeTaskGallery()" class="text-white text-2xl hover:text-yellow-400 transition bg-zinc-800 w-10 h-10 rounded-full flex items-center justify-center border border-zinc-700">
                <i class="fas fa-times"></i>
            </button>
        </div>
        
        <div class="w-full max-w-5xl h-[80vh] bg-zinc-900 border border-yellow-500/30 rounded-2xl overflow-y-auto p-6 shadow-2xl grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4" id="galleryGrid">
            <!-- Files & PDFs Injected Here -->
        </div>
    </div>

    <!-- Footer -->
    <footer class="border-t border-zinc-200 dark:border-zinc-800/80 bg-white/60 dark:bg-zinc-900/60 backdrop-blur-md py-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-4">
                <a href="index.html">
                    <img src="New Lgogo_Gray Logo.png" alt="3 Engineers" class="h-8 opacity-60 hover:opacity-100 grayscale hover:grayscale-0 transition">
                </a>
                <span class="text-gray-500 text-sm font-medium" data-i18n="footer_rights">© 2026 3 Engineers Center. All rights reserved.</span>
            </div>
            <div class="flex gap-4">
                <a href="https://facebook.com/your-page" target="_blank" class="w-10 h-10 rounded-xl bg-zinc-200 dark:bg-zinc-800 border border-zinc-300 dark:border-zinc-700 flex items-center justify-center text-gray-600 dark:text-gray-400 hover:text-zinc-950 hover:bg-yellow-500 transition-all duration-300" title="Facebook"><i class="fab fa-facebook-f"></i></a>
                <a href="https://linkedin.com/in/your-profile" target="_blank" class="w-10 h-10 rounded-xl bg-zinc-200 dark:bg-zinc-800 border border-zinc-300 dark:border-zinc-700 flex items-center justify-center text-gray-600 dark:text-gray-400 hover:text-zinc-950 hover:bg-yellow-500 transition-all duration-300" title="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
                <a href="https://wa.me/201116512028" target="_blank" class="w-10 h-10 rounded-xl bg-zinc-200 dark:bg-zinc-800 border border-zinc-300 dark:border-zinc-700 flex items-center justify-center text-gray-600 dark:text-gray-400 hover:text-zinc-950 hover:bg-yellow-500 transition-all duration-300" title="WhatsApp"><i class="fab fa-whatsapp"></i></a>
            </div>
        </div>
    </footer>

    <!-- JavaScript -->
    <script>
        const translations = {
            en: {
                page_title: "Best Of Work - Structural Diploma | 3 Engineers",
                nav_home: "Home",
                nav_courses: "Training Programs",
                nav_best_work: "Best Of Work",
                badge_title: "Structural Engineering Diploma Showcase",
                main_title1: "Student Best Works &",
                main_title2: "R25 Tasks Exhibition",
                main_desc: "Browse student tasks from Task 0 to Task 7 pulled directly from GitHub repository folders.",
                open_gallery: "Browse Task Folder",
                footer_rights: "© 2026 3 Engineers Center. All rights reserved."
            },
            ar: {
                page_title: "أفضل أعمال الطلبة - الدبلومة الإنشائية | 3 Engineers",
                nav_home: "الرئيسية",
                nav_courses: "البرامج التدريبية",
                nav_best_work: "أفضل الأعمال",
                badge_title: "معرض مشاريع الدبلومة الهندسية الإنشائية",
                main_title1: "أفضل أعمال الطلبة",
                main_title2: "ومعرض تاسكات R25 (من 0 إلى 7)",
                main_desc: "تصفح جميع تاسكات الطلبة والملفات بصيغتي الصور والـ PDF مباشرة من مجلدات جيت هاب.",
                open_gallery: "تصفح فولدر التاسك",
                footer_rights: "© 2026 جميع الحقوق محفوظة لمركز 3 Engineers"
            }
        };

        const portfolioData = {
            abdallah: [
                { id: 0, title: "Task 0 - A limitless model, create your opportunity", folderName: "Task 0 - A limitless model, create your opportunity", files: ["Task-0-1.pdf", "Task-0-1.png"] },
                { id: 1, title: "Task 1 - BIM Fundamentals", folderName: "Task 1 - BIM Fundamentals", files: ["Task-1-1.pdf", "Task-1-1.png"] },
                { id: 2, title: "Task 2 - Be Specialist in Modeling - Part 1", folderName: "Task 2 - Be Specialist in Modeling - Part 1", files: ["Task-2-1.pdf", "Task-2-1.png"] },
                { id: 3, title: "Task 3 - Be Specialist in Modeling - Part 2", folderName: "Task 3 - Be Specialist in Modeling - Part 2", files: ["Task-3-1.pdf", "Task-3-1.png", "Task-3-2.png", "Task-3-3.png"] },
                { id: 4, title: "Task 4 - Be Specialist in Modeling - Part 3", folderName: "Task 4 - Be Specialist in Modeling - Part 3", files: ["Task-4-1.pdf", "Task-4-4.pdf", "Task-4-1.png"] },
                { id: 5, title: "Task 5 - Secret of Design Drawing - Part 1", folderName: "Task 5 - Secret of Design Drawing - Part 1", files: ["Task-5-1.pdf", "sections.pdf", "سقف الارضي.pdf", "سقف الاول والمتكرر.pdf"] },
                { id: 6, title: "Task 6 - Secret of Design Drawing - Part 2", folderName: "Task 6 - Secret of Design Drawing - Part 2", files: ["Task-6-1.pdf", "Task-6-1.png"] },
                { id: 7, title: "Task 7 - BIM Department System", folderName: "Task 7 - BIM Department System", files: ["Task-7-1.pdf", "Task-7-1.png"] }
            ],
            saman: [
                { id: 0, title: "Task 0 - A limitless model", folderName: "Task 0 - A limitless model, create your opportunity", files: ["Task-0-1.pdf"] },
                { id: 1, title: "Task 1 - BIM Fundamentals", folderName: "Task 1 - BIM Fundamentals", files: ["Task-1-1.pdf"] },
                { id: 2, title: "Task 2 - Be Specialist in Modeling", folderName: "Task 2 - Be Specialist in Modeling - Part 1", files: ["Task-2-1.pdf"] },
                { id: 3, title: "Task 3 - Be Specialist in Modeling", folderName: "Task 3 - Be Specialist in Modeling - Part 2", files: ["Task-3-1.pdf"] },
                { id: 4, title: "Task 4 - Be Specialist in Modeling", folderName: "Task 4 - Be Specialist in Modeling - Part 3", files: ["Task-4-1.pdf"] },
                { id: 5, title: "Task 5 - Secret of Design Drawing", folderName: "Task 5 - Secret of Design Drawing - Part 1", files: ["Task-5-1.pdf"] },
                { id: 6, title: "Task 6 - Secret of Design Drawing", folderName: "Task 6 - Secret of Design Drawing - Part 2", files: ["Task-6-1.pdf"] },
                { id: 7, title: "Task 7 - BIM Department System", folderName: "Task 7 - BIM Department System", files: ["Task-7-1.pdf"] }
            ],
            youssef: [
                { id: 0, title: "Task 0 - A limitless model", folderName: "Task 0 - A limitless model, create your opportunity", files: ["Task-0-1.pdf"] },
                { id: 1, title: "Task 1 - BIM Fundamentals", folderName: "Task 1 - BIM Fundamentals", files: ["Task-1-1.pdf"] },
                { id: 2, title: "Task 2 - Be Specialist in Modeling", folderName: "Task 2 - Be Specialist in Modeling - Part 1", files: ["Task-2-1.pdf"] },
                { id: 3, title: "Task 3 - Be Specialist in Modeling", folderName: "Task 3 - Be Specialist in Modeling - Part 2", files: ["Task-3-1.pdf"] },
                { id: 4, title: "Task 4 - Be Specialist in Modeling", folderName: "Task 4 - Be Specialist in Modeling - Part 3", files: ["Task-4-1.pdf"] },
                { id: 5, title: "Task 5 - Secret of Design Drawing", folderName: "Task 5 - Secret of Design Drawing - Part 1", files: ["Task-5-1.pdf"] },
                { id: 6, title: "Task 6 - Secret of Design Drawing", folderName: "Task 6 - Secret of Design Drawing - Part 2", files: ["Task-6-1.pdf"] },
                { id: 7, title: "Task 7 - BIM Department System", folderName: "Task 7 - BIM Department System", files: ["Task-7-1.pdf"] }
            ]
        };

        let currentLang = 'en';

        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'ar' : 'en';
            const htmlRoot = document.getElementById('htmlRoot');
            htmlRoot.setAttribute('lang', currentLang);
            htmlRoot.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
            document.getElementById('langText').innerText = currentLang === 'en' ? 'AR' : 'EN';

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[currentLang][key]) {
                    el.innerText = translations[currentLang][key];
                }
            });
        }

        function toggleTheme() {
            const htmlRoot = document.getElementById('htmlRoot');
            const themeIcon = document.getElementById('themeIcon');
            if (htmlRoot.classList.contains('dark')) {
                htmlRoot.classList.remove('dark');
                htmlRoot.classList.add('light');
                localStorage.setItem('siteTheme', 'light');
                themeIcon.classList.remove('fa-sun');
                themeIcon.classList.add('fa-moon');
            } else {
                htmlRoot.classList.remove('light');
                htmlRoot.classList.add('dark');
                localStorage.setItem('siteTheme', 'dark');
                themeIcon.classList.remove('fa-moon');
                themeIcon.classList.add('fa-sun');
            }
        }

        function filterEngineer(engKey) {
            ['abdallah', 'saman', 'youssef'].forEach(k => {
                const btn = document.getElementById(`btn-${k}`);
                if(btn) {
                    btn.className = "px-5 py-2.5 rounded-xl font-bold text-sm bg-zinc-800/80 text-gray-300 border border-zinc-700 hover:bg-yellow-500/20 hover:text-yellow-400 transition-all";
                }
            });
            const activeBtn = document.getElementById(`btn-${engKey}`);
            if(activeBtn) {
                activeBtn.className = "px-5 py-2.5 rounded-xl font-bold text-sm bg-yellow-500 text-zinc-950 shadow-md transition-all";
            }

            renderTasks(engKey);
        }

        function renderTasks(engKey) {
            const container = document.getElementById('tasksContainer');
            container.innerHTML = '';
            const tasks = portfolioData[engKey];
            const engFolder = engKey === 'abdallah' ? 'Abdallah Nagy - R25' : (engKey === 'saman' ? 'عبدالله السمان - R25' : 'يوسف عادل - R25');

            tasks.forEach(task => {
                const card = document.createElement('div');
                card.className = "glass-card p-6 flex flex-col justify-between";
                
                const firstImg = task.files.find(f => f.toLowerCase().endsWith('.png') || f.toLowerCase().endsWith('.jpg'));
                const rawPath = `best_of_work/${engFolder}/${task.folderName}/${firstImg}`;
                const previewPath = firstImg ? encodeURI(rawPath) : '';
                
                card.innerHTML = `
                    <div>
                        <div class="task-img-container mb-4 h-52 cursor-pointer bg-zinc-900 border border-zinc-800 flex items-center justify-center overflow-hidden rounded-xl group" onclick='openTaskGallery("${engFolder}", ${JSON.stringify(task)})'>
                            ${firstImg ? 
                                `<img src="${previewPath}" alt="${task.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" onerror="this.parentElement.innerHTML='<div class=\'flex flex-col items-center justify-center text-yellow-500\'><i class=\'fas fa-file-pdf text-5xl mb-2 text-red-500\'></i><span class=\'text-xs text-gray-300\'>Click to View Task Files</span></div>'">` :
                                `<div class="flex flex-col items-center justify-center text-yellow-500">
                                    <i class="fas fa-folder-open text-5xl mb-2 text-yellow-400"></i>
                                    <span class="text-xs text-gray-300">Browse Task PDFs</span>
                                </div>`
                            }
                            <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity flex flex-col items-center justify-center text-yellow-400 font-bold gap-1">
                                <i class="fas fa-folder-open text-2xl"></i> <span class="text-xs">Browse Task Folder</span>
                            </div>
                        </div>
                        <div class="flex justify-between items-start mb-2">
                            <span class="px-3 py-1 bg-yellow-500/10 border border-yellow-500/30 text-yellow-500 text-xs font-bold rounded-lg">Task 0${task.id}</span>
                            <span class="text-xs font-bold text-yellow-400 bg-yellow-500/10 border border-yellow-500/20 px-2.5 py-1 rounded-md">${engFolder.split(' - ')[0]}</span>
                        </div>
                        <h3 class="text-lg font-bold mb-2">${task.title}</h3>
                        <p class="text-sm text-gray-500 dark:text-gray-400 mb-6">Contains execution shop drawings, structural models, and calculation reports.</p>
                    </div>
                    <button onclick='openTaskGallery("${engFolder}", ${JSON.stringify(task)})' class="w-full bg-yellow-500/10 hover:bg-yellow-500 hover:text-zinc-950 text-yellow-500 border border-yellow-500/30 font-bold py-2.5 px-4 rounded-xl transition-all duration-300 flex items-center justify-center gap-2 text-sm">
                        <i class="fas fa-images"></i> <span data-i18n="open_gallery">Browse Task Folder</span>
                    </button>
                `;
                container.appendChild(card);
            });
        }

        function openTaskGallery(engFolder, task) {
            const modal = document.getElementById('taskGalleryModal');
            const titleEl = document.getElementById('galleryTitle');
            const gridEl = document.getElementById('galleryGrid');

            modal.classList.remove('hidden');
            titleEl.innerText = `${engFolder} - ${task.title}`;
            gridEl.innerHTML = '';

            task.files.forEach(file => {
                const rawFilePath = `best_of_work/${engFolder}/${task.folderName}/${file}`;
                const filePath = encodeURI(rawFilePath);
                const itemDiv = document.createElement('div');
                itemDiv.className = "bg-zinc-800/60 border border-zinc-700 rounded-xl p-3 flex flex-col items-center justify-center gap-2 h-48 overflow-hidden relative group";
                
                if(file.toLowerCase().endsWith('.pdf')) {
                    itemDiv.innerHTML = `
                        <i class="fas fa-file-pdf text-red-500 text-4xl mb-2"></i>
                        <span class="text-xs text-gray-300 truncate max-w-full" title="${file}">${file}</span>
                        <a href="${filePath}" target="_blank" class="mt-2 bg-yellow-500/20 text-yellow-400 hover:bg-yellow-500 hover:text-zinc-950 font-bold px-3 py-1.5 rounded-lg text-xs transition flex items-center gap-1.5">
                            <i class="fas fa-external-link-alt"></i> Open PDF File
                        </a>
                    `;
                } else {
                    itemDiv.innerHTML = `
                        <img src="${filePath}" alt="Task File" class="w-full h-32 object-cover rounded-lg group-hover:scale-105 transition duration-300" onerror="this.src='https://images.unsplash.com/photo-1503387762-592deb58ef4e?q=80&w=800&auto=format&fit=crop'">
                        <span class="text-xs text-gray-300 truncate max-w-full" title="${file}">${file}</span>
                    `;
                }
                gridEl.appendChild(itemDiv);
            });
        }

        function closeTaskGallery() {
            document.getElementById('taskGalleryModal').classList.add('hidden');
        }

        window.addEventListener('DOMContentLoaded', () => {
            const currentTheme = localStorage.getItem('siteTheme') || 'dark';
            const themeIcon = document.getElementById('themeIcon');
            if (currentTheme === 'light') {
                themeIcon.classList.remove('fa-sun');
                themeIcon.classList.add('fa-moon');
            }
            renderTasks('abdallah');
        });
    </script>
</body>
</html>
