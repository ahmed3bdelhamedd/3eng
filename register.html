<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التسجيل - 3 Engineers</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <a href="index.html"><img src="New Lgogo_Gray Logo.png" alt="3 Engineers Logo"></a>
        </div>
        <nav>
            <a href="index.html">العودة للرئيسية</a>
        </nav>
    </header>

    <section class="hero" style="padding: 50px 20px; max-width: 600px; margin: auto;">
        <h1>سجل الآن</h1>
        <p style="color: var(--text-muted); margin-bottom: 30px;">اختر الكورس المناسب وحدد طريقة الحضور.</p>
        
        <div class="card" style="text-align: right;">
            <!-- يمكنك ربط هذا الفورم بخدمة مثل Formspree لاستقبال البيانات على إيميلك -->
            <form action="#" method="POST">
                <label style="display: block; margin-bottom: 5px;">الاسم بالكامل:</label>
                <input type="text" name="name" required style="width: 100%; padding: 10px; margin-bottom: 15px; background: #333; color: white; border: 1px solid #555; border-radius: 5px; box-sizing: border-box;">
                
                <label style="display: block; margin-bottom: 5px;">رقم الهاتف (واتساب):</label>
                <input type="tel" name="phone" required style="width: 100%; padding: 10px; margin-bottom: 15px; background: #333; color: white; border: 1px solid #555; border-radius: 5px; box-sizing: border-box;">
                
                <label style="display: block; margin-bottom: 5px;">اختر الكورس:</label>
                <select name="course" style="width: 100%; padding: 10px; margin-bottom: 15px; background: #333; color: white; border: 1px solid #555; border-radius: 5px; box-sizing: border-box;">
                    <option value="bim">دبلومة الـ BIM المتكاملة</option>
                    <option value="structure">التصميم الإنشائي المتقدم</option>
                </select>

                <label style="display: block; margin-bottom: 5px;">طريقة الحضور:</label>
                <select name="attendance" style="width: 100%; padding: 10px; margin-bottom: 25px; background: #333; color: white; border: 1px solid #555; border-radius: 5px; box-sizing: border-box;">
                    <option value="online">أونلاين (Live)</option>
                    <option value="offline">في مقر المركز</option>
                </select>
                
                <button type="submit" class="btn-primary" style="width: 100%; border: none; cursor: pointer; padding: 12px; font-size: 16px;">إرسال طلب التسجيل</button>
            </form>
        </div>
    </section>
</body>
</html>
