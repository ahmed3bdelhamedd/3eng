<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | 3 Engineers</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Cairo Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            background-image: radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.05) 0%, transparent 50%);
        }
        
        .glass-panel {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .input-field {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid border-slate-600;
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            color: white;
            transition: all 0.3s ease;
        }
        .input-field:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        .btn-glow {
            transition: all 0.3s ease;
        }
        .btn-glow:hover {
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- تأثيرات الإضاءة في الخلفية -->
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden -z-10">
        <div class="absolute top-[-10%] right-[-5%] w-[500px] h-[500px] rounded-full bg-blue-600/20 blur-[100px]"></div>
        <div class="absolute bottom-[-10%] left-[-5%] w-[500px] h-[500px] rounded-full bg-indigo-600/20 blur-[100px]"></div>
    </div>

    <!-- نافذة تسجيل الدخول/إنشاء الحساب -->
    <div class="glass-panel w-full max-w-md p-8 rounded-2xl relative z-10">
        <!-- اللوجو -->
        <div class="flex justify-center mb-8">
            <a href="index.html">
                <img src="New Lgogo_Gray Logo.png" alt="3 Engineers" class="h-12">
            </a>
        </div>

        <!-- أزرار التبديل (Tabs) -->
        <div class="flex mb-8 border-b border-slate-700">
            <button id="loginTabBtn" onclick="toggleForm('login')" class="flex-1 pb-3 text-center font-bold text-blue-400 border-b-2 border-blue-500 transition-colors">
                تسجيل الدخول
            </button>
            <button id="signupTabBtn" onclick="toggleForm('signup')" class="flex-1 pb-3 text-center font-bold text-gray-400 border-b-2 border-transparent hover:text-gray-200 transition-colors">
                حساب جديد
            </button>
        </div>

        <!-- فورم تسجيل الدخول (Login) -->
        <form id="loginForm" class="space-y-5 transition-opacity duration-300">
            <div>
                <label class="block text-sm text-gray-300 mb-2">البريد الإلكتروني</label>
                <div class="relative">
                    <i class="fas fa-envelope absolute right-3 top-3.5 text-gray-500"></i>
                    <input type="email" class="input-field pr-10 border-slate-600" placeholder="example@email.com" required>
                </div>
            </div>
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="block text-sm text-gray-300">كلمة المرور</label>
                    <a href="#" class="text-xs text-blue-400 hover:text-blue-300">نسيت كلمة المرور؟</a>
                </div>
                <div class="relative">
                    <i class="fas fa-lock absolute right-3 top-3.5 text-gray-500"></i>
                    <input type="password" class="input-field pr-10 border-slate-600" placeholder="••••••••" required>
                </div>
            </div>
            
            <div class="flex items-center gap-2 mt-2">
                <input type="checkbox" id="remember" class="rounded border-gray-600 bg-slate-800 text-blue-500 focus:ring-blue-500">
                <label for="remember" class="text-sm text-gray-400 cursor-pointer">تذكرني على هذا الجهاز</label>
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg mt-6 btn-glow">
                دخول
            </button>
        </form>

        <!-- فورم إنشاء الحساب (Sign Up) -->
        <form id="signupForm" class="space-y-5 hidden transition-opacity duration-300">
            <div>
                <label class="block text-sm text-gray-300 mb-2">الاسم بالكامل</label>
                <div class="relative">
                    <i class="fas fa-user absolute right-3 top-3.5 text-gray-500"></i>
                    <input type="text" class="input-field pr-10 border-slate-600" placeholder="الاسم ثلاثي" required>
                </div>
            </div>
            <div>
                <label class="block text-sm text-gray-300 mb-2">البريد الإلكتروني</label>
                <div class="relative">
                    <i class="fas fa-envelope absolute right-3 top-3.5 text-gray-500"></i>
                    <input type="email" class="input-field pr-10 border-slate-600" placeholder="example@email.com" required>
                </div>
            </div>
            <div>
                <label class="block text-sm text-gray-300 mb-2">رقم الهاتف (للتواصل)</label>
                <div class="relative">
                    <i class="fas fa-phone absolute right-3 top-3.5 text-gray-500"></i>
                    <input type="tel" class="input-field pr-10 border-slate-600" placeholder="01xxxxxxxxx" required>
                </div>
            </div>
            <div>
                <label class="block text-sm text-gray-300 mb-2">كلمة المرور</label>
                <div class="relative">
                    <i class="fas fa-lock absolute right-3 top-3.5 text-gray-500"></i>
                    <input type="password" class="input-field pr-10 border-slate-600" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-lg mt-6 btn-glow">
                إنشاء الحساب
            </button>
        </form>
    </div>

    <!-- سكربت التبديل بين الفورمز -->
    <script>
        function toggleForm(type) {
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const loginBtn = document.getElementById('loginTabBtn');
            const signupBtn = document.getElementById('signupTabBtn');

            if (type === 'login') {
                // إظهار الدخول
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                // تفعيل زر الدخول
                loginBtn.classList.add('text-blue-400', 'border-blue-500');
                loginBtn.classList.remove('text-gray-400', 'border-transparent');
                // تعطيل زر الحساب الجديد
                signupBtn.classList.remove('text-blue-400', 'border-blue-500');
                signupBtn.classList.add('text-gray-400', 'border-transparent');
            } else {
                // إظهار الحساب الجديد
                signupForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
                // تفعيل زر الحساب الجديد
                signupBtn.classList.add('text-blue-400', 'border-blue-500');
                signupBtn.classList.remove('text-gray-400', 'border-transparent');
                // تعطيل زر الدخول
                loginBtn.classList.remove('text-blue-400', 'border-blue-500');
                loginBtn.classList.add('text-gray-400', 'border-transparent');
            }
        }
    </script>
</body>
</html>
