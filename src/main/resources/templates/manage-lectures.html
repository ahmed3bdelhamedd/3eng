<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منشىء محتوى الكورس - 3 Engineers</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="New Lgogo_Gray Logo.png">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { brand: { 500: '#38bdf8', 600: '#0284c7' } } } }
        }
    </script>
    <!-- Cairo Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { 
            font-family: 'Cairo', sans-serif; 
            background-color: #070b14; 
            color: #f8fafc; 
            overflow-x: hidden;
        }
        .blueprint-bg {
            background-image: 
                linear-gradient(rgba(56, 189, 248, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56, 189, 248, 0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -2;
        }
        .glass-nav { 
            backdrop-filter: blur(16px); 
            background: rgba(7, 11, 20, 0.9); 
            border-bottom: 1px solid rgba(56, 189, 248, 0.15); 
        }
        .glass-card { 
            background: linear-gradient(145deg, rgba(15, 23, 42, 0.75), rgba(11, 17, 32, 0.85)); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(56, 189, 248, 0.12); 
            border-radius: 20px; 
        }
    </style>
</head>
<body class="antialiased min-h-screen pb-16 relative">

    <div class="blueprint-bg"></div>

    <!-- شريط علوي موحد وثابت بنفس الهوية -->
    <header class="glass-nav fixed w-full z-50 top-0 py-4 px-6 flex justify-between items-center shadow-lg">
        <div class="flex items-center gap-3">
            <a href="index.html" class="flex items-center gap-2">
                <img src="New Lgogo_Gray Logo.png" alt="3 Engineers" class="h-9">
            </a>
            <div class="hidden sm:block border-r border-slate-700 pr-3 mr-1">
                <h3 class="text-white font-bold text-xs">أحمد عبد الحميد</h3>
                <span class="text-[10px] text-blue-400 font-semibold">مدير النظام</span>
            </div>
        </div>
        
        <h1 class="text-base sm:text-lg font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-400">
            منشىء محتوى الكورس والمحاضرات
        </h1>
        
        <a href="admin_dashboard.html" class="text-xs sm:text-sm font-bold text-gray-300 hover:text-white bg-slate-800 border border-slate-700 px-4 py-2 rounded-xl transition flex items-center gap-2 shadow-sm">
            <span>العودة للوحة الإدارة</span> <i class="fas fa-arrow-left"></i>
        </a>
    </header>

    <main class="max-w-4xl mx-auto px-4 pt-28">
        <!-- نموذج إضافة محاضرة جديدة -->
        <div class="glass-card p-6 sm:p-8 mb-8 shadow-xl">
            <h2 class="text-lg font-bold text-white mb-6 flex items-center gap-2 border-b border-slate-700/80 pb-3">
                <i class="fas fa-plus-circle text-blue-400"></i> إضافة محاضرة جديدة للمنهج
            </h2>
            <form id="lectureForm" onsubmit="addLecture(event)" class="space-y-5">
                <div>
                    <label class="block text-sm text-gray-300 mb-2 font-semibold">عنوان المحاضرة</label>
                    <input type="text" id="lecTitle" required placeholder="مثال: مقدمة في تكنولوجيا الـ BIM وتجهيز بيئة العمل" class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 text-sm">
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm text-gray-300 mb-2 font-semibold">مدة المحاضرة (بالدقائق)</label>
                        <input type="number" id="lecDuration" required placeholder="45" class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 text-sm">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-300 mb-2 font-semibold">نوع الفيديو / المنصة</label>
                        <select id="lecPlatform" class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 text-sm">
                            <option value="Vimeo">Vimeo</option>
                            <option value="YouTube">YouTube</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-sm text-gray-300 mb-2 font-semibold">كود التضمين (iframe) أو الرابط</label>
                    <textarea id="lecIframe" rows="3" required placeholder="يرجى التأكد من نسخ كود الـ iframe كاملاً من إعدادات الخصوصية في فيديو Vimeo" class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 text-sm"></textarea>
                </div>
                <button type="submit" class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold px-6 py-3.5 rounded-xl transition shadow-lg shadow-blue-600/30 flex items-center gap-2 text-sm">
                    <i class="fas fa-save"></i> حفظ وإضافة للمنهج
                </button>
            </form>
        </div>

        <!-- قائمة المحاضرات المرفوعة حالياً مع أزرار التحكم في الترتيب -->
        <div class="glass-card p-6 sm:p-8 shadow-xl">
            <div class="flex justify-between items-center mb-6 border-b border-slate-700/80 pb-3">
                <h2 class="text-lg font-bold text-white flex items-center gap-2">
                    <i class="fas fa-list-ol text-blue-400"></i> المحاضرات المرفوعة حالياً
                </h2>
                <span class="text-xs text-gray-400 bg-slate-800/80 px-3 py-1.5 rounded-full border border-slate-700">يمكنك ترتيب المحاضرات بالأسهم</span>
            </div>
            
            <div id="lecturesList" class="space-y-4">
                <!-- سيتم تعبئة المحاضرات ديناميكياً هنا -->
            </div>
        </div>
    </main>

    <script>
        let lectures = JSON.parse(localStorage.getItem('courseLectures')) || [
            { title: "مقدمة في تكنولوجيا الـ BIM وتجهيز بيئة العمل", duration: "45", platform: "Vimeo" },
            { title: "شرح واجهة برنامج Revit المعماري والإنشائي", duration: "60", platform: "Vimeo" }
        ];

        function renderLectures() {
            const listContainer = document.getElementById('lecturesList');
            listContainer.innerHTML = '';

            if (lectures.length === 0) {
                listContainer.innerHTML = `<p class="text-center text-gray-500 py-6 text-sm">لا توجد محاضرات مرفوعة حالياً.</p>`;
                return;
            }

            lectures.forEach((lec, index) => {
                const item = document.createElement('div');
                item.className = "bg-slate-900/90 border border-slate-800 p-4 rounded-xl flex items-center justify-between gap-4 transition hover:border-slate-700";
                
                item.innerHTML = `
                    <div class="flex items-center gap-4 flex-grow">
                        <span class="w-8 h-8 rounded-lg bg-blue-600/20 border border-blue-500/40 text-blue-400 font-bold flex items-center justify-center text-sm">${index + 1}</span>
                        <div>
                            <h4 class="text-white font-bold text-sm mb-1">${lec.title}</h4>
                            <span class="text-xs text-gray-400 flex items-center gap-2">
                                <i class="fas fa-video text-blue-400"></i> مرتبط بـ ${lec.platform} 
                                <span class="w-1 h-1 rounded-full bg-gray-600"></span> 
                                <i class="far fa-clock text-gray-500"></i> ${lec.duration} دقيقة
                            </span>
                        </div>
                    </div>
                    
                    <div class="flex items-center gap-1.5">
                        <button onclick="moveUp(${index})" title="تحريك لأعلى" class="w-8 h-8 rounded-lg bg-slate-800 text-gray-300 hover:text-white hover:bg-slate-700 border border-slate-700 flex items-center justify-center transition ${index === 0 ? 'opacity-30 cursor-not-allowed' : ''}">
                            <i class="fas fa-chevron-up text-xs"></i>
                        </button>
                        <button onclick="moveDown(${index})" title="تحريك لأسفل" class="w-8 h-8 rounded-lg bg-slate-800 text-gray-300 hover:text-white hover:bg-slate-700 border border-slate-700 flex items-center justify-center transition ${index === lectures.length - 1 ? 'opacity-30 cursor-not-allowed' : ''}">
                            <i class="fas fa-chevron-down text-xs"></i>
                        </button>
                        <button onclick="deleteLecture(${index})" title="حذف" class="w-8 h-8 rounded-lg bg-red-900/20 text-red-400 hover:bg-red-600 hover:text-white border border-red-500/30 flex items-center justify-center transition ml-2">
                            <i class="fas fa-trash text-xs"></i>
                        </button>
                    </div>
                `;
                listContainer.appendChild(item);
            });
        }

        function addLecture(e) {
            e.preventDefault();
            const title = document.getElementById('lecTitle').value;
            const duration = document.getElementById('lecDuration').value;
            const platform = document.getElementById('lecPlatform').value;
            
            lectures.push({ title, duration, platform });
            localStorage.setItem('courseLectures', JSON.stringify(lectures));
            
            document.getElementById('lectureForm').reset();
            renderLectures();
        }

        function moveUp(index) {
            if (index > 0) {
                const temp = lectures[index];
                lectures[index] = lectures[index - 1];
                lectures[index - 1] = temp;
                localStorage.setItem('courseLectures', JSON.stringify(lectures));
                renderLectures();
            }
        }

        function moveDown(index) {
            if (index < lectures.length - 1) {
                const temp = lectures[index];
                lectures[index] = lectures[index + 1];
                lectures[index + 1] = temp;
                localStorage.setItem('courseLectures', JSON.stringify(lectures));
                renderLectures();
            }
        }

        function deleteLecture(index) {
            if (confirm('هل أنت متأكد من حذف هذه المحاضرة؟')) {
                lectures.splice(index, 1);
                localStorage.setItem('courseLectures', JSON.stringify(lectures));
                renderLectures();
            }
        }

        document.addEventListener('DOMContentLoaded', renderLectures);
    </script>
</body>
</html>
